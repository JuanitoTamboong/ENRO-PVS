<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENRO • Sign In</title>
    
    <!-- Paths are relative to root, so no "../" needed -->
    <link rel="stylesheet" href="./css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="h-full bg-ink-50 font-sans text-ink-800">

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-enro-950 via-enro-900 to-ink-900 p-4">
    <div class="w-full max-w-sm">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-white/10 backdrop-blur rounded-2xl flex items-center justify-center mx-auto mb-4 border border-white/20">
                <img src="./assets/enro-logo.png" alt="ENRO logo" class="w-12 h-12 object-contain">
            </div>
            <h1 class="text-white font-bold text-lg tracking-tight">ENRO Portal</h1>
            <p class="text-enro-300/70 text-xs mt-1">Permit & Extraction Volume Monitoring</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <!-- Role Toggle -->
            <div class="flex border-b border-ink-100">
                <button type="button" id="tab-login-admin" onclick="toggleLoginMode('admin')"
                    class="flex-1 py-3.5 text-xs font-bold text-enro-700 border-b-2 border-enro-700 bg-white transition">
                    <i class="fa-solid fa-user-shield mr-1.5"></i>Admin
                </button>
                <button type="button" id="tab-login-user" onclick="toggleLoginMode('user')"
                    class="flex-1 py-3.5 text-xs font-bold text-ink-400 border-b-2 border-transparent hover:text-ink-600 transition">
                    <i class="fa-solid fa-user mr-1.5"></i>Staff
                </button>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="p-6 space-y-5">
                <div>
                    <label id="lbl-username" class="block text-[11px] font-bold text-ink-500 uppercase tracking-wider mb-1.5">Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-ink-300 text-xs"></i>
                        <input type="text" id="username" required value="admin" class="input-field pl-9" placeholder="Enter username">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-ink-500 uppercase tracking-wider mb-1.5">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-ink-300 text-xs"></i>
                        <input type="password" id="password" required value="admin123" class="input-field pl-9" placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2 text-ink-500 cursor-pointer">
                        <input type="checkbox" checked class="rounded border-ink-300 text-enro-600 focus:ring-enro-500 h-3.5 w-3.5">
                        <span>Remember me</span>
                    </label>
                    <a href="#" onclick="showToast('Contact ENRO IT administrator for password reset.','info')" class="text-enro-600 hover:underline font-semibold">Forgot?</a>
                </div>

                <button type="submit" class="btn-primary w-full justify-center py-3">
                    <span id="btn-login-text">Sign in as Admin</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>

                <p class="text-center text-[11px] text-ink-400 pt-1">
                    Demo: <span class="font-mono text-ink-600">admin / admin123</span>
                </p>
            </form>
        </div>

        <p class="text-center text-[10px] text-enro-300/50 mt-6">
            © 2026 Provincial Government • ENRO Office
        </p>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast">
    <div id="toast-icon" class="shrink-0">
        <i class="fa-solid fa-circle-check text-enro-400 text-lg"></i>
    </div>
    <div class="flex-1 min-w-0">
        <h5 id="toast-title" class="font-bold text-xs text-white">Success</h5>
        <p id="toast-message" class="text-[11px] text-ink-300 mt-0.5 leading-relaxed">Operation completed.</p>
    </div>
</div>

<script src="./js/app.js"></script>
<script>
    // If already logged in, skip login page and go to dashboard
    if (sessionStorage.getItem('enro_logged_in') === '1') {
        window.location.href = './pages/dashboard.html';
    }
</script>
</body>
</html>
